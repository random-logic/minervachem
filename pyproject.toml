[build-system]
requires = [
    "setuptools>=61,<82",
    "setuptools-scm[simple]>=9.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "minervachem"
dynamic = ["version"]
description = "Machine learning for Cheminformatics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "BSD 3-Clause License" }

authors = [
    { name = "Michael Frederick Tynes", email = "mtynes@lanl.gov" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "numpy>=1.26.4,<2",
    "scipy>=1.11.4,<2",
    "pandas>=1.5.3,<2",
    "scikit-learn>=1.2.2,<2",
    "tqdm>=4.70.0,<5",
    "sigfig>=1.3.19,<2",
    "matplotlib>=3.11.1,<4",
    "pillow>=9.5.0,<10",
    "imageio>=2.37.4,<3",
    "lightgbm>=4.7.0,<5",
    "flaml>=2.6.0,<3",
    "networkx>=2.8.8,<3",
    "cairosvg>=2.9.0,<3",
    "jupyterlab>=4.6.2,<5",
    "ipywidgets>=8.1.8,<9",
    "seaborn>=0.13.2,<1",
    "joblib>=1.3.0",
    "svglib>=2.1.0,<3",
    "sparse>=0.13.0",
    "dask>=2026.7.1",
    "distributed>=2026.7.1",
    "rdkit>2023.9.6,<2026.0",
    "buhito<1",
    "reportlab>=5.0.0,<6",
    "architector>=0.0.10,<1",
]

[project.urls]
Homepage = "https://github.com/lanl/minervachem"
"Bug Tracker" = "https://github.com/lanl/minervachem/issues"
"Source Code" = "https://github.com/lanl/minervachem"

[project.optional-dependencies]
lamel = [
    "minervachem-lamel<1.0",
]
dev = [
    "pytest>=6.2.4,<10.0",
    "coverage>=5.5,<8.0",
    "PyTDC>=0.4.1,<1",
    "setuptools>=61,<82",
    "xgboost>=3.2.0,<4",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]

[tool.uv.workspace]
members = ["lamel"]

[tool.uv.sources]
minervachem = { workspace = true }
minervachem-lamel = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["minervachem*"]

[tool.setuptools.package-data]
"minervachem.mcts.sa_score" = ["fpscores.pkl.gz", "LICENSE", "README.md"]
