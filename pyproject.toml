[project]
name = "minervachem"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib",
    "scikit-learn==1.2.2",
    "ipywidgets",
    "dask",
    "distributed",
    "seaborn",
    "tqdm",
    "rdkit==2023.9.6",
    "lightgbm",
    "imageio",
    "numpy",
    "flaml",
    "jupyterlab",
    "scipy>=1.10,<1.12",
    "pillow",
    "joblib>=1.3.0",
    "pandas",
    "sparse",
    "svglib",
    "cairosvg",
    "sigfig",
    "networkx",
    "setuptools<81",
    "xgboost",
    "pytdc",
    "pytest>=6.2.4",
    "coverage>=5.5",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]